<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 2: Interfaz Web</title>
</head>
<body>
    <h1>Controlando la Web con TypeScript</h1>
    
    <!-- 1. Creamos un botón y le asignamos un ID único (como el nombre de variable en Java) -->
    <button id="btnSaludar">Saludar al Programador</button>

    <!-- 2. Un contenedor de texto vacío donde TypeScript escribirá el resultado -->
    <p id="txtMensaje"></p>

    <!-- Conexión con el JavaScript resultante -->
    <script type="module" src="index.js"></script>
</body>
</html>
